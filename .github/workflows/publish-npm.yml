name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish, for example 3.0.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish aura-glass to npm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Show publish runtime
        run: |
          node --version
          npm --version

      # TEMPORARY diagnostic: confirms npm's trusted publisher config matches this
      # workflow's OIDC claims before spending ~10 minutes on release gates.
      # Remove once publishing is confirmed working.
      - name: Probe npm OIDC token exchange
        run: |
          set -uo pipefail
          id_token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value // empty')
          if [ -z "$id_token" ]; then
            echo "FAILED to obtain ID token"; exit 1
          fi
          payload=$(printf '%s' "$id_token" | cut -d. -f2)
          case $(( ${#payload} % 4 )) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac
          printf '%s' "$payload" | tr '_-' '/+' | base64 -d 2>/dev/null \
            | jq '{repository, repository_owner, workflow_ref, ref, environment}'
          code=$(curl -sS -o /tmp/exchange.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" \
            -H "Content-Type: application/json" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/aura-glass")
          echo "exchange HTTP $code"
          if [ "$code" = "200" ]; then
            echo "trusted publishing OK for this workflow"
          else
            cat /tmp/exchange.json; echo
            echo "trusted publisher config does not match this workflow; failing early"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify package version
        run: |
          actual="$(node -p "require('./package.json').version")"
          expected="${{ inputs.version }}"
          if [ "$actual" != "$expected" ]; then
            echo "package.json version $actual does not match requested version $expected"
            exit 1
          fi

      - name: Verify release gates
        run: |
          npm run typecheck -- --pretty false
          npm run build
          npm run lint:no-core-ui-deps
          npm run test:tree-shaking -- --strict
          npm run test:a11y:app-chrome
          npm run verify:pack
          npm run verify:css-vars
          npm run test:integration:next -- --skip-build
          npm run test:integration:vite -- --skip-build
          npm run test:visual:app-chrome -- --skip-build

      - name: Publish with npm trusted publishing
        if: env.HAS_NPM_TOKEN != 'true'
        run: |
          # setup-node's registry-url writes an .npmrc with
          # `_authToken=${NODE_AUTH_TOKEN}` plus `always-auth=true`. With no
          # NPM_TOKEN secret the token expands to a literal placeholder (=> E404)
          # and always-auth makes npm fail ENEEDAUTH rather than fall back. Remove
          # the file entirely so npm performs the OIDC exchange.
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ]; then
            rm -f "$NPM_CONFIG_USERCONFIG"
          fi
          npm publish --access public

      - name: Publish with npm token provenance
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
